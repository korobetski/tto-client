# Tag, and the APK is downloadable.
#
#   git tag -a v1.0.0 -m "..." && git push origin v1.0.0
#
# ### What this is for
#
# `TTO_CLIENT_DOWNLOAD_ANDROID` on the server has to point at a URL a phone can open. GitHub
# Releases is that URL; the `android-apks` artifact `build.yml` already uploads is not, because
# downloading an Actions artifact requires authentication and a player has none. That is the whole
# reason this workflow exists separately from the build.
#
# ### The shape of it
#
#   verify  →  publish
#
# `verify` is the same gate as CI, re-run against the tagged commit — a tag can be placed anywhere,
# including on a commit that was never on `main`. `publish` signs and uploads only after it passes.
#
# ### The version comes from the tag
#
# `-PclientVersion` is derived from `github.ref_name`, so the APK's `versionName`, its `versionCode`
# and the release it hangs under are one number by construction. The alternative — a number in
# `gradle.properties` that somebody remembers to bump before tagging — is the one that eventually
# ships `v1.1.0` containing 1.0.0.
name: Release

on:
  push:
    tags: ['v*']

# Never two releases at once. Unlike CI this does not cancel one in flight: a cancelled run between
# creating the release and attaching the APK leaves a release with no download behind it, which is
# worse than a slow queue.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # For `com.tripletriad:core`, same as build.yml — an anonymous read of GitHub Packages is a 401
  # even when the package is public, so this is the condition for the build resolving at all.
  packages: read

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  verify:
    name: ktlint + detekt + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v4
      - run: ./gradlew ktlintCheck detekt :shared:desktopTest --no-daemon
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-reports
          path: '**/build/reports/'
          retention-days: 30

  # The three desktop installers, each built on the only machine that can build it.
  #
  # ### Why this is a matrix and not three Gradle tasks
  #
  # jpackage packages *for the host*. `TargetFormat.Dmg` on Linux is not a slow build, it is an
  # error — the tool shells out to `hdiutil`, `wixl`, `dpkg-deb` as appropriate and those exist on
  # one platform each. So `packageDistributionForCurrentOS` is the task, and the runner chooses
  # what comes out. `desktopApp/build.gradle.kts` lists all three formats for the same reason.
  #
  # ### They are not signed, and that is visible to whoever downloads them
  #
  # No Apple Developer certificate and no Windows code-signing certificate exist for this project,
  # and neither can be conjured in CI. The consequences are per platform and are stated in the
  # release notes rather than left for a player to discover:
  #
  # * **macOS** refuses an unsigned, un-notarized app outright on first launch. Opening it takes
  #   right-click → Open, or `xattr -d com.apple.quarantine`. This is the harshest of the three.
  # * **Windows** shows a SmartScreen warning with a "More info → Run anyway" behind it.
  # * **Linux** does not care; a `.deb` carries no such expectation.
  #
  # A signed macOS build would need a paid Apple account, which is the same door the App Store is
  # behind — and `docs/` records the decision not to go through it. So the `.dmg` ships with an
  # instruction rather than a signature.
  installers:
    name: ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One platform's toolchain failing must not hide the other two: the point of a matrix here
      # is to learn about all three in one run.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux .deb
            format: deb
          - os: windows-latest
            label: Windows .msi
            format: msi
          - os: macos-latest
            label: macOS .dmg
            format: dmg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5

      # No `setup-android` here, unlike the APK job. `:desktopApp` reaches `:shared`, which does
      # configure an Android target, but building its desktop compilation does not need the SDK —
      # `build.yml`'s desktop job has run without it since it was written.

      # `v1.0.0` → `1.0.0`, as in `publish`. Recomputed rather than passed between jobs: it is one
      # parameter expansion, and plumbing an output across a matrix costs more than it saves.
      # `bash` is named explicitly because the Windows runner's default shell is PowerShell.
      - name: Read the version from the tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build the installer
        shell: bash
        run: |
          ./gradlew :desktopApp:packageDistributionForCurrentOS --no-daemon \
            -PclientVersion="${{ steps.version.outputs.value }}"

      # Named for the version and the platform, because the file outlives the page it came from —
      # the same argument the APK's own rename makes. jpackage's own names differ per platform
      # (`triple-triad_1.0.0-1_amd64.deb`, `Triple Triad-1.0.0.msi`), so this also gives the three
      # one shape.
      #
      # The glob is checked rather than trusted: `mv` on a pattern that matched nothing produces a
      # file literally called `*.deb`, which would then be uploaded and attached to the release.
      - name: Name the installer
        id: installer
        shell: bash
        run: |
          built=$(find desktopApp/build/compose/binaries/main -name "*.${{ matrix.format }}" -type f)
          count=$(printf '%s\n' "$built" | grep -c . || true)
          if [ "$count" != "1" ]; then
            echo "::error::expected one .${{ matrix.format }}, found $count" >&2
            printf '%s\n' "$built" >&2
            exit 1
          fi
          name="tto-${{ steps.version.outputs.value }}.${{ matrix.format }}"
          mv "$built" "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - name: Upload the installer
        uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.format }}
          path: ${{ steps.installer.outputs.path }}
          # An installer is a build output, not a record. The release is where it lives.
          retention-days: 7

  publish:
    name: Signed APK
    # The installers gate the release as much as the tests do. A release that carries the APK
    # today and the desktop builds tomorrow publishes a download page that is wrong for as long
    # as the gap lasts, under a URL people are already reading — the same argument the concurrency
    # block above makes about cancelling mid-publish. Both platforms, or neither.
    needs: [verify, installers]
    runs-on: ubuntu-latest
    # On `publish` and not on `verify`, so the approval is asked for only once the build is green —
    # being paged to approve something that then fails its own tests is how an approval becomes a
    # reflex. Add a required reviewer to this environment in the repository settings to make it a
    # prompt; left without one it gates nothing and only records the publication in the deployment
    # history, which is why the line is worth having either way.
    #
    # What it protects is not a server but a file leaving the building: once an APK is attached to a
    # public release and someone has downloaded it, deleting the release does not take it back.
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    timeout-minutes: 30
    env:
      # The keystore travels as base64 because a GitHub secret is a string and a `.jks` is not
      # text. Decoded to a file below, inside the runner, and never written anywhere the build
      # could pick it up by accident.
      TTO_KEYSTORE_BASE64: ${{ secrets.TTO_KEYSTORE_BASE64 }}
      TTO_KEYSTORE_PASSWORD: ${{ secrets.TTO_KEYSTORE_PASSWORD }}
      TTO_KEY_ALIAS: ${{ secrets.TTO_KEY_ALIAS }}
      TTO_KEY_PASSWORD: ${{ secrets.TTO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      # Fails before anything is built, naming the secret that is missing. Without this the run
      # goes green and publishes an *unsigned* APK — androidApp/build.gradle.kts leaves the variant
      # unsigned rather than failing, deliberately, so that contributors who hold no key can still
      # build. That trade is only safe if the one place that hands an APK to a player refuses.
      #
      # Values are never printed, only whether each is empty.
      - name: Check the signing secrets
        run: |
          missing=""
          for name in TTO_KEYSTORE_BASE64 TTO_KEYSTORE_PASSWORD TTO_KEY_ALIAS TTO_KEY_PASSWORD; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty repository secrets:$missing" >&2
            echo "Set them under Settings → Secrets and variables → Actions." >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v4

      # `$RUNNER_TEMP`, not the workspace: the workspace is what `upload-artifact` and any later
      # packaging step glob over, and a keystore sitting in it is a keystore one careless `path:`
      # away from being published next to the APK it signed.
      - name: Restore the keystore
        run: |
          umask 077
          printf '%s' "$TTO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

          # Exported to the **job**, not to one step. The other three secrets are job-level `env`
          # above; this one cannot be, because `runner.temp` is not a context that `jobs.<id>.env`
          # can read. Setting it per step is what it used to do, and the bug that produced is worth
          # naming: `assembleRelease` had it, `verifyReleaseApk` did not, so the second invocation
          # configured the module with three of the four and `androidApp/build.gradle.kts` refused
          # the partial set — correctly, and after a green build, so the release failed at the last
          # step with a message about signing.
          #
          # `$GITHUB_ENV` puts it in front of every later step at once, so no step added after this
          # one can be the fourth thing that forgets.
          echo "TTO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

          # `base64 -d` is not the check it looks like: GNU coreutils decodes a truncated secret,
          # and even one holding something that was never a keystore, and exits 0 either way. The
          # size is the only thing it tells us, so it is reported rather than tested — a keystore is
          # a couple of kilobytes, and a handful of bytes here means the secret is wrong.
          echo "decoded $(stat -c%s "$RUNNER_TEMP/release.jks") bytes"

          # keytool is the real check, and it writes its diagnosis to **stdout**, not stderr. An
          # earlier version of this step sent that to /dev/null and so failed with a bare
          # "Process completed with exit code 1" — the one outcome this step exists to prevent. The
          # output is captured and echoed on failure instead, and it names which of the two
          # problems it is: "keystore password was incorrect" against "EOFException" for a secret
          # that did not arrive whole. Neither message contains the password.
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
              -storepass "$TTO_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keytool.log" 2>&1; then
            echo "::error::The keystore did not open - see keytool below." >&2
            cat "$RUNNER_TEMP/keytool.log" >&2
            exit 1
          fi

          # The alias is checked here rather than left to the build, where a wrong one surfaces as
          # `KeytoolException: Failed to read key <alias> from store` in the middle of
          # packageRelease — a message about the store, for a problem with a name.
          if ! grep -qi "^${TTO_KEY_ALIAS}," "$RUNNER_TEMP/keytool.log"; then
            echo "::error::No key called '$TTO_KEY_ALIAS' in the keystore. It holds:" >&2
            grep -i "PrivateKeyEntry" "$RUNNER_TEMP/keytool.log" >&2 || true
            exit 1
          fi

      # `v1.0.0` → `1.0.0`. The build validates the shape; this only strips the prefix, and a tag
      # that is not a version fails there rather than producing an APK numbered from nonsense.
      - name: Read the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Both artifacts from one invocation, so they are built from identical inputs and signed
      # with the same key. The APK is what this project distributes — sideloaded, see
      # docs/migration/12-PHASE-8-RELEASE.md — and the bundle is what a store would require if that
      # decision ever changes. Producing it now costs one task and keeps the option open; producing
      # it later, in a hurry, is when the signing configuration turns out to have drifted.
      - name: Build the signed APK and bundle
        run: |
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease --no-daemon \
            -PclientVersion="${{ steps.version.outputs.value }}"

      # The minified build is where a keep rule that stopped working shows up, and it shows up as a
      # crash on a player's device rather than as a failed build. `verifyReleaseApk` reads the APK
      # that was just produced and refuses it if R8 removed the Compose resources or the generated
      # serializers. It runs here, against the *signed* artifact, and not only in `check`.
      #
      # That last sentence was false until 2026-08-14 and this step had never once succeeded on a
      # tag. Two faults, both of which only appear when signing is configured — that is, only here:
      # `TTO_KEYSTORE` was scoped to the build step alone, so this invocation configured the module
      # with three of the four secrets and was refused; and the task named the *unsigned* APK, which
      # a signed build does not produce. Both are fixed and both are reproduced locally with a
      # throwaway keystore, because neither is reachable from a build that has no key.
      - name: Verify the minified APK kept what it needs
        run: ./gradlew :androidApp:verifyReleaseApk --no-daemon

      # Proves the APK is signed before it is offered to anyone, rather than trusting that the
      # configuration above took effect. An unsigned APK is not a broken download — it installs on
      # nothing, and the player is told only that the package is invalid.
      #
      # AGP names the two outcomes differently, which is the first half of the check: an unsigned
      # build produces `androidApp-release-unsigned.apk` and no `androidApp-release.apk` at all. So
      # the absence of that file *is* the diagnosis, and it is worth saying out loud rather than
      # leaving apksigner to report a missing file.
      - name: Verify the signature
        run: |
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::$apk was not produced - the release variant built unsigned." >&2
            ls -1 androidApp/build/outputs/apk/release/ >&2
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          "$apksigner" verify --print-certs "$apk"

      # Named for the version, because the file outlives the page it was downloaded from: an
      # `androidApp-release.apk` in a downloads folder says nothing about which release it is.
      - name: Name the artifact
        id: artifact
        run: |
          name="tto-${{ steps.version.outputs.value }}.apk"
          mv androidApp/build/outputs/apk/release/androidApp-release.apk "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"

          # The bundle travels with the release but is **not** what the updater downloads: a player
          # cannot install an .aab, and the in-app update checker looks for the .apk asset. It is
          # here so that a store submission, if it ever happens, uses the artifact that was built
          # and signed alongside the APK people actually ran.
          bundle=androidApp/build/outputs/bundle/release/androidApp-release.aab
          if [ -f "$bundle" ]; then
            mv "$bundle" "tto-${{ steps.version.outputs.value }}.aab"
            echo "bundle=tto-${{ steps.version.outputs.value }}.aab" >> "$GITHUB_OUTPUT"
          fi

      # The three installers the matrix built, flattened into the working directory beside the APK.
      # `merge-multiple` because each matrix leg uploaded its own artifact and they are wanted as
      # one set of files, not three folders.
      - name: Collect the desktop installers
        uses: actions/download-artifact@v6
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers

      # Counted, not globbed into the upload. `needs: installers` already guarantees all three legs
      # succeeded, so a missing file here means the artifact did not arrive — and a release that
      # quietly carries two of the three platforms is exactly what `needs:` was added to prevent.
      - name: Check the installers arrived
        id: desktop
        run: |
          missing=""
          for format in deb msi dmg; do
            file="installers/tto-${{ steps.version.outputs.value }}.$format"
            [ -f "$file" ] || missing="$missing $format"
          done
          if [ -n "$missing" ]; then
            echo "::error::the installer jobs passed but these did not arrive:$missing" >&2
            ls -lR installers >&2
            exit 1
          fi
          ls -1 installers/*

      # `gh` rather than a third-party action: it ships on the runner, and creating a release is
      # one command. `--generate-notes` fills the body from the commits since the previous tag.
      #
      # The asset URL this produces is what the server hands to players, and it is stable:
      #
      #   https://github.com/${{ github.repository }}/releases/download/<tag>/<name>
      #
      # It is only reachable without credentials while this repository is public. If it is ever
      # made private, this URL 404s for players and the download has to move.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="${{ steps.artifact.outputs.path }}"
          bundle="${{ steps.artifact.outputs.bundle }}"
          version="${{ steps.version.outputs.value }}"

          # The APK first, so it is the asset a reader's eye lands on, then the three desktop
          # installers, then the bundle — which is for a store submission that may never happen and
          # which nobody should download by mistake.
          assets=("$asset")
          for format in deb msi dmg; do
            assets+=("installers/tto-$version.$format")
          done
          [ -n "$bundle" ] && assets+=("$bundle")

          # Written to a file and passed with `--notes-file`, because `--generate-notes` fills the
          # body from commits and would leave a player with a changelog and four downloads named
          # after file extensions. The generated notes are fetched from the API and appended, so
          # nothing is lost — `gh release create` takes one or the other, not both.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > generated.md || : > generated.md
          {
            echo "### Downloads"
            echo
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Android | \`tto-$version.apk\` — sideload; enable installs from this source |"
            echo "| Linux | \`tto-$version.deb\` — \`sudo apt install ./tto-$version.deb\` |"
            echo "| Windows | \`tto-$version.msi\` |"
            echo "| macOS | \`tto-$version.dmg\` |"
            echo
            echo "The desktop installers are **not code-signed** — there is no Apple or Windows"
            echo "certificate for this project. Windows shows a SmartScreen warning with"
            echo "\"More info → Run anyway\" behind it. macOS refuses the app on first launch;"
            echo "open it once with right-click → Open, or clear the quarantine flag:"
            echo
            echo '```'
            echo "xattr -d com.apple.quarantine \"/Applications/Triple Triad.app\""
            echo '```'
            echo
            cat generated.md
          } > notes.md

          # `gh release create` fails outright when the tag already carries a release, which is the
          # normal state on a re-run: every attempt that got this far had already created it, and
          # every attempt that failed earlier — a bad secret, a rejected approval — leaves a release
          # somebody made by hand or a previous run left behind. Refusing to continue there turns a
          # transient failure into one that can only be cleared by deleting the release.
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md
            exit 0
          fi

          # The release exists. Attaching what is missing is safe to repeat — but **replacing** an
          # asset is not, and that is why there is no `--clobber` here. An asset already published
          # is an asset players may have downloaded, and overwriting it serves different bytes under
          # a URL that names a version, which is the mutable-tag problem `tto-server`'s release
          # workflow argues against for images. A rebuild that must go out is a new tag.
          #
          # Checked per asset rather than on the APK alone: a run that failed between creating the
          # release and finishing the upload can leave any subset attached, and the four are built
          # by four different jobs. Uploading only what is absent is what makes a re-run recover
          # that state instead of being blocked by the one file that did arrive.
          published=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          absent=()
          for candidate in "${assets[@]}"; do
            if printf '%s\n' "$published" | grep -qxF "$(basename "$candidate")"; then
              echo "already published: $(basename "$candidate")"
            else
              absent+=("$candidate")
            fi
          done

          # Every asset is already there. Not an error — it is what a re-run of a *successful*
          # publish looks like — but nothing may be replaced, so there is nothing left to do.
          if [ ${#absent[@]} -eq 0 ]; then
            echo "::error::$GITHUB_REF_NAME already carries every asset - refusing to replace" \
              "artifacts that may already have been downloaded. Tag a new version instead." >&2
            exit 1
          fi

          echo "attaching: ${absent[*]}"
          gh release upload "$GITHUB_REF_NAME" "${absent[@]}"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### $GITHUB_REF_NAME"
            echo
            echo "Point the server at it, in \`/srv/tto/.env\`:"
            echo
            echo '```'
            echo "TTO_CLIENT_VERSION=${{ steps.version.outputs.value }}"
            echo -n "TTO_CLIENT_DOWNLOAD_ANDROID=https://github.com/$GITHUB_REPOSITORY"
            echo "/releases/download/$GITHUB_REF_NAME/${{ steps.artifact.outputs.path }}"
            echo '```'
            echo
            echo "Desktop installers are attached to the release for Linux, Windows and macOS."
            echo "None of the three is code-signed; the release notes say so and what to do"
            echo "about it. The server's update check only knows about the APK."
          } >> "$GITHUB_STEP_SUMMARY"
