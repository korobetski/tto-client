org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Parallel project sync, Gradle 9.4+.
org.gradle.tooling.parallel=true

kotlin.code.style=official

# The release number of the app, and the only place it is written. `:androidApp` derives both of its
# Android fields from it and `:desktopApp` uses it as the package version, so the three numbers that
# used to be edited separately — and had already drifted to 1, "0.1.0" and "1.0.0" — cannot disagree
# again.
#
# A property rather than a constant in a build file, so the release workflow can pass the tag it was
# triggered by — `-PclientVersion=1.1.0` for `v1.1.0` — exactly as `tto-core` does with
# `coreVersion`. The value here is what a local build gets, and it has to be a real number rather
# than a placeholder: an APK built by hand is an APK that can end up installed on a phone.
#
# Starting at 1.0.0 because that is what this build is. `AppVersion.kt` in `:core` puts the protocol
# major at 1 for card copies, global card ids and the set model together, and the app carrying them
# is the app's 1.0.0. The value it replaces, "0.1.0", named the build from before that break.
#
# This is **not** the protocol version and must not be conflated with it. That one lives in `:core`,
# moves only on a replay-affecting break, and is what the server's gate compares. This one moves on
# every release.
clientVersion=1.1.2

android.useAndroidX=true
android.nonTransitiveRClass=true

# Silences a four-times-per-build nag asking for
# `android.dependency.excludeLibraryComponentsFromConstraints=true`, which AGP 9 reports as
# deprecated the moment it is set — the suggestion contradicts itself. Its documented
# replacement, `android.dependency.useConstraints=false`, drops the constraints AGP publishes
# between library components; that is a resolution change, and the nag it would quiet is a
# sync-time optimization "for very large projects", which this is not. So the advice is
# declined explicitly rather than acted on.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Removed rather than kept: this file used to carry nine `android.*` migration shims that
# pinned AGP 9 to AGP 8 behavior, seven of which AGP 9 itself reports as deprecated. They
# were added together during the Gradle 9 / AGP 9 upgrade to get the build green, so none of
# them was individually known to be needed. Each was dropped and the build re-run — five turned
# out to be inert, and the two that were not were pinning AGP 8 plugin layouts that had to be
# migrated properly instead:
#
#   builtInKotlin=false + newDsl=false         these two were load-bearing, and hid two real
#                                              migrations: AGP 9 brings Kotlin itself, so
#                                              `:androidApp` had to drop
#                                              `org.jetbrains.kotlin.android`, and
#                                              `com.android.library` cannot be applied next to
#                                              Kotlin Multiplatform any more, so `:shared`
#                                              moved to
#                                              `com.android.kotlin.multiplatform.library`
#   defaults.buildfeatures.resvalues=true      no module declares a `resValue`
#   sdk.defaultTargetSdkToCompileSdkIfUnset    `:androidApp` sets targetSdk; libraries ignore it
#   enableAppCompileTimeRClass=false           no Kotlin source references `R`
#   usesSdkInManifest.disallowed=false         no manifest declares `<uses-sdk>`
#   r8.optimizedResourceShrinking=false        `isMinifyEnabled = false`, so R8 does not run
#   uniquePackageNames=false / dependency.useConstraints=true
#                                              defaults in AGP 9; the explicit values were
#                                              restating them
#
# If one of these has to come back, it wants a comment saying which build failure it fixes.
